name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate that costs nothing and catches the worst mistake: a secret in the tree.
  # Mirrors the "Secret hygiene" step in scripts/quality-gate.ps1 so local and CI agree.
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tracked .env or key material
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(?!example)' ; then
            echo "::error::an .env-style file is tracked"; exit 1
          fi
          if git ls-files | grep -E '\.(pem|pfx|p12|key)$' ; then
            echo "::error::key material is tracked"; exit 1
          fi
      - name: No secret-shaped content in tracked files
        run: |
          set -euo pipefail
          pattern='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{24,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          # git grep exits 1 when nothing matches, which is the success case here.
          # Locations only on failure — a scanner that echoes what it matched IS the leak.
          if hits=$(git grep -nE "$pattern" -- ':!*.example' ':!*.lock' | cut -d: -f1,2) ; then
            echo "::error::potential secret content in tracked files: $hits"; exit 1
          fi
      - name: No production-shaped PagentOS credentials
        run: |
          set -euo pipefail
          # Mirrors the gate (2026-09-01 history investigation): a real mint is
          # pagentos_ok_/pagentos_st_ + 43 urlsafe chars; 40+ catches it with margin.
          # SHAPE-based, no allowlist — fixtures are legitimate only while off-shape.
          if hits=$(git grep -nE 'pagentos_(ok|st)_[A-Za-z0-9_-]{40,}' | cut -d: -f1,2) ; then
            echo "::error::production-shaped PagentOS credential in tracked files (values not shown): $hits"; exit 1
          fi

  api-lint-unit:
    name: API lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -m "not integration and not live" -q

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: api-lint-unit
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Start dev services
        working-directory: infra/docker
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: Integration tests
        run: uv run pytest -m integration -q
      - name: Stop dev services
        if: always()
        working-directory: infra/docker
        run: docker compose -f docker-compose.dev.yml down -v

  recovery-supervisor:
    name: Recovery supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/recovery-supervisor
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  browser-agent:
    name: Browser agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/browser
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser E2E tests
        run: uv run pytest -q -m browser

  # The Windows agent has to build and test on Windows: its identity model is Windows
  # kernel behaviour (pipe ACLs, client impersonation, session ids), not portable code.
  windows-agent:
    name: Windows agent build + tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: devices/windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: devices/windows-agent/global.json
      - name: Build
        run: dotnet build -c Release --nologo
      - name: Tests
        run: dotnet test -c Release --nologo --no-build
      # 2026-09-09: harness-symbols.tests.ps1 - the static guard for closures that call a
      # name only a dot-sourced scope defines - existed since 2026-09-06 and was run by
      # NOTHING. The defect it describes reached the owner's install in a file the guard's
      # hand-typed list did not cover. It runs here now, with the regression that drives
      # the real Cloud Core verifier in a clean child process.
      #
      # 2026-09-12 (B02): the same shape again, and a worse instance - this hand-typed list
      # had grown to 24 of the repository's 26 suites, and one of the two it omitted was
      # cloud-release-bluegreen.tests.ps1: 59 cases covering the release path PRODUCTION
      # ACTUALLY USES. A list nobody checks drifts. test_ci_covers_every_suite now fails
      # when a suite exists that this step does not name, so the list cannot silently fall
      # behind again.
      # The installer/deployment/identity scripts run on the owner's machine under
      # WINDOWS POWERSHELL 5.1, and four real qualification failures were 5.1-only
      # (native quoting, StrictMode unrolling, ??, ImportFromPem). windows-latest still
      # ships 5.1 as powershell.exe; these suites assert the engine themselves and would
      # fail rather than pass vacuously on pwsh.
      - name: PowerShell 5.1 script suites
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          powershell -NoProfile -File scripts\tests\script-syntax.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-strictmode.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-invocation.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-deploy.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-acl.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-browser.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-evidence.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\agent-update.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-release.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\browser-smoke-evidence.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\agent-release-currency.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\machine-readable.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\identity-restore.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\provision.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\config-swap.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\agent-audit.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\owner-explain.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\cloud-secret.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\cloud-owner-rotation.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\cloud-release.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\cloud-release-bluegreen.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\item28-gate.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\utf8-json.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\core-verifier-scope.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\harness-symbols.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\owner-harness.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\native-signing-trust.tests.ps1
      # The staged update, end to end, against the REAL DeviceService this job just built:
      # candidate identity, the complete capability manifest (40 with -DisplayPower and a
      # browser worker, browser.media_* included), promotion, Cloud Core verification,
      # refusal of an invalid candidate, and rollback. This is the chain the 2026-09-08
      # incident broke; it runs on every commit now, and it needs no install and no network.
      - name: Staged-update qualification
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: powershell -NoProfile -File scripts\qualify-staged-update.ps1

  # Until 2026-09-12 (B02) this job ran `build` and nothing else: 82 files and 1587 web tests,
  # plus the linter the package itself defines, were behind no gate at all. Every milestone
  # since M18 quoted a web suite count in its evidence - counts nobody in CI had ever seen.
  web-build:
    name: Web shell build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm --dir apps/web lint
      - name: Unit tests (vitest)
        run: pnpm --dir apps/web test
      - name: Build
        run: pnpm --dir apps/web build
      # AFTER the build, deliberately. tsconfig includes `.next/types/**`, which `next build`
      # generates; nothing in the tree needs those types TODAY (measured 2026-09-12: tsc is
      # clean with .next deleted), but the day something does, this order is the difference
      # between a green developer machine with a warm .next and a red CI checkout - the
      # local-masks-CI divergence this repository has been bitten by before. The step is not
      # a duplicate of the build either: `next build` type-checks the app but NOT the tests,
      # and the tests are where the contract types (session-contract.ts, the ui_state shapes)
      # are actually exercised.
      - name: Types (tsc --noEmit, tests included)
        run: pnpm --dir apps/web typecheck
