name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint-unit:
    name: API lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: api-lint-unit
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Start dev services
        working-directory: infra/docker
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: Integration tests
        run: uv run pytest -m integration -q
      - name: Stop dev services
        if: always()
        working-directory: infra/docker
        run: docker compose -f docker-compose.dev.yml down -v

  browser-agent:
    name: Browser agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/browser
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser E2E tests
        run: uv run pytest -q -m browser

  web-build:
    name: Web shell build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --dir apps/web build
