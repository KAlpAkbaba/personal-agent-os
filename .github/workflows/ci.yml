name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate that costs nothing and catches the worst mistake: a secret in the tree.
  # Mirrors the "Secret hygiene" step in scripts/quality-gate.ps1 so local and CI agree.
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tracked .env or key material
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(?!example)' ; then
            echo "::error::an .env-style file is tracked"; exit 1
          fi
          if git ls-files | grep -E '\.(pem|pfx|p12|key)$' ; then
            echo "::error::key material is tracked"; exit 1
          fi
      - name: No secret-shaped content in tracked files
        run: |
          set -euo pipefail
          pattern='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{24,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          # git grep exits 1 when nothing matches, which is the success case here.
          # Locations only on failure — a scanner that echoes what it matched IS the leak.
          if hits=$(git grep -nE "$pattern" -- ':!*.example' ':!*.lock' | cut -d: -f1,2) ; then
            echo "::error::potential secret content in tracked files: $hits"; exit 1
          fi
      - name: No production-shaped PagentOS credentials
        run: |
          set -euo pipefail
          # Mirrors the gate (2026-09-01 history investigation): a real mint is
          # pagentos_ok_/pagentos_st_ + 43 urlsafe chars; 40+ catches it with margin.
          # SHAPE-based, no allowlist — fixtures are legitimate only while off-shape.
          if hits=$(git grep -nE 'pagentos_(ok|st)_[A-Za-z0-9_-]{40,}' | cut -d: -f1,2) ; then
            echo "::error::production-shaped PagentOS credential in tracked files (values not shown): $hits"; exit 1
          fi

  api-lint-unit:
    name: API lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: api-lint-unit
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Start dev services
        working-directory: infra/docker
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: Integration tests
        run: uv run pytest -m integration -q
      - name: Stop dev services
        if: always()
        working-directory: infra/docker
        run: docker compose -f docker-compose.dev.yml down -v

  recovery-supervisor:
    name: Recovery supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/recovery-supervisor
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  browser-agent:
    name: Browser agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/browser
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser E2E tests
        run: uv run pytest -q -m browser

  # The Windows agent has to build and test on Windows: its identity model is Windows
  # kernel behaviour (pipe ACLs, client impersonation, session ids), not portable code.
  windows-agent:
    name: Windows agent build + tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: devices/windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: devices/windows-agent/global.json
      - name: Build
        run: dotnet build -c Release --nologo
      - name: Tests
        run: dotnet test -c Release --nologo --no-build
      # The installer/deployment/identity scripts run on the owner's machine under
      # WINDOWS POWERSHELL 5.1, and four real qualification failures were 5.1-only
      # (native quoting, StrictMode unrolling, ??, ImportFromPem). windows-latest still
      # ships 5.1 as powershell.exe; these suites assert the engine themselves and would
      # fail rather than pass vacuously on pwsh.
      - name: PowerShell 5.1 script suites
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          powershell -NoProfile -File scripts\tests\script-syntax.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-strictmode.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-invocation.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-deploy.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\installer-acl.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\machine-readable.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\identity-restore.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\provision.tests.ps1 && ^
          powershell -NoProfile -File scripts\tests\config-swap.tests.ps1

  web-build:
    name: Web shell build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --dir apps/web build
