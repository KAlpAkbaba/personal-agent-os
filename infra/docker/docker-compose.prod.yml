# Personal Agent OS — production Cloud Core on the Hetzner host (RQ-2, ADR-0032).
#
# Network posture, matching infra/opentofu and the constitution: NO public application
# port. The only service published on a host interface at all is the API, and it binds
# ${PAGENTOS_BIND_IP} — the host's TAILSCALE address, never 0.0.0.0. Everything else
# (postgres, redis, minio, temporal) stays on the compose-internal network; not even
# loopback publishing, because nothing on the host needs them except the API container.
#
# Secrets: this file contains none. /opt/pagentos/.env (root-owned, 0600, written once by
# scripts/cloud/deploy-cloud-core.sh with generated values) supplies them via compose
# interpolation. Every secret variable uses the :? form so a missing value refuses to
# start instead of starting open.
#
# Data: everything persistent lives under /mnt/pagentos-data — the dedicated Hetzner
# volume — so the server itself stays rebuildable (infra/opentofu keeps the volume with
# prevent_destroy).

name: pagentos-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pagentos-prod-postgres
    environment:
      POSTGRES_USER: pagentos
      POSTGRES_PASSWORD: ${PAGENTOS_DB_PASSWORD:?set in /opt/pagentos/.env}
      POSTGRES_DB: pagentos_prod
    volumes:
      - /mnt/pagentos-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagentos -d pagentos_prod"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pagentos-prod-redis
    # Ephemeral/cache only (constitution): no persistence, nothing to lose.
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    # Initial artifact store on the VPS (ADR-0032): same S3 interface the app already
    # speaks; migrating the bucket to Hetzner Object Storage later is a config change
    # (PAGENTOS_S3_*), not a code change.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: pagentos-prod-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: pagentos-artifacts
      MINIO_ROOT_PASSWORD: ${PAGENTOS_S3_SECRET:?set in /opt/pagentos/.env}
    volumes:
      - /mnt/pagentos-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: pagentos-prod-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: pagentos
      POSTGRES_PWD: ${PAGENTOS_DB_PASSWORD:?set in /opt/pagentos/.env}
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  api: &cloud-core
    build:
      context: ../../services/api
    image: pagentos/cloud-core:local
    container_name: pagentos-prod-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment: &cloud-core-env
      PAGENTOS_DATABASE_URL: postgresql+psycopg://pagentos:${PAGENTOS_DB_PASSWORD:?}@postgres:5432/pagentos_prod
      PAGENTOS_REDIS_URL: redis://redis:6379/0
      PAGENTOS_S3_ENDPOINT_URL: http://minio:9000
      PAGENTOS_S3_ACCESS_KEY: pagentos-artifacts
      PAGENTOS_S3_SECRET_KEY: ${PAGENTOS_S3_SECRET:?}
      PAGENTOS_S3_BUCKET: pagentos-artifacts
      PAGENTOS_TEMPORAL_ADDRESS: temporal:7233
      PAGENTOS_VOICE_PROFILE_SECRET: ${PAGENTOS_VOICE_PROFILE_SECRET:?set in /opt/pagentos/.env}
      # M12 (ADR-0038): the realtime voice provider key. OPTIONAL - absent means the
      # adapter is simply not registered and the realtime surface reports it inactive;
      # nothing else changes. Installed into /opt/pagentos/.env by
      # scripts/cloud/set-cloud-secret.ps1 over Tailscale SSH (stdin only, never argv).
      PAGENTOS_VOICE_OPENAI_API_KEY: ${PAGENTOS_VOICE_OPENAI_API_KEY:-}
      # The Anthropic key (research synthesis today; the coding backend that writes the
      # engine's own patches next). OPTIONAL in exactly the same way as the line above:
      # absent means the deterministic synthesis provider is used and nothing else changes.
      # Installed the same way — scripts/cloud/set-cloud-secret.ps1, stdin only, never argv
      # — and that installer REFUSES a host whose compose does not wire the name, which is
      # why this line has to exist before the owner can supply the value.
      PAGENTOS_ANTHROPIC_API_KEY: ${PAGENTOS_ANTHROPIC_API_KEY:-}
      # Production is never "dev": the simulated provider is barred from selection here.
      PAGENTOS_ENVIRONMENT: ${PAGENTOS_ENVIRONMENT:-prod}
      # The web shell is reached over the tailnet; set to the real private origin(s).
      # A JSON list, and `[]` rather than empty: pydantic-settings parses complex fields as
      # JSON, so an empty string is a parse error ("error parsing value for field
      # web_origins"), not an empty list. Defaulting to no origins is also the right
      # production posture — CORS is an allowlist, and nothing browser-based is served yet.
      PAGENTOS_WEB_ORIGINS: ${PAGENTOS_WEB_ORIGINS:-[]}
      # Bootstrap runs ONCE, from the host itself, through this loopback-only guard.
      PAGENTOS_IDENTITY_BOOTSTRAP_LOOPBACK_ONLY: "true"
      # M13/ADR-0050 §9: production runs no separate worker container, and the
      # browser-research fetch path needs this process's own BrokerRuntime for
      # immediate device-command delivery anyway — so the Temporal worker runs
      # embedded, in-process. Tests default to PAGENTOS_WORKER_MODE=off.
      PAGENTOS_WORKER_MODE: embedded
      # M18.4 (spec §2): the version model. The release script exports the sha it put
      # here; "unknown" is reported as unknown, never guessed from the tree.
      PAGENTOS_RELEASE: ${PAGENTOS_RELEASE:-}
      PAGENTOS_LAST_KNOWN_GOOD: ${PAGENTOS_LAST_KNOWN_GOOD:-}
    volumes:
      # ADR-0027: the owner-credential hash lives OUTSIDE the database and OUTSIDE the
      # image, on the persistent volume, so neither a DB restore nor an image rebuild
      # can mint or destroy owner identity.
      - /mnt/pagentos-data/identity:/srv/pagentos/var/identity
      # B08 (reqs 646-650, 647): what the `backup` health check and the failure-notice
      # sweep read, and NOTHING else - the last backup record, the restore drills and the
      # failure markers, read-only. Until 2026-09-18 none of it was mounted, so production
      # answered `backup: skipped (backup_root_not_visible)` and a failed backup, drill or
      # recovery could not reach the owner. The restic repository itself and the repository
      # password stay off this mount: the API reads the SAFETY NET's state, never its data.
      - ${PAGENTOS_BACKUP_ROOT:-/var/lib/pagentos-backup}/LAST_BACKUP.json:/var/lib/pagentos-backup/LAST_BACKUP.json:ro
      - ${PAGENTOS_BACKUP_ROOT:-/var/lib/pagentos-backup}/drills:/var/lib/pagentos-backup/drills:ro
      - ${PAGENTOS_BACKUP_ROOT:-/var/lib/pagentos-backup}/failures:/var/lib/pagentos-backup/failures:ro
    ports:
      # The ONE published socket, and only on the tailnet address. If PAGENTOS_BIND_IP
      # is unset the stack refuses to start rather than defaulting to 0.0.0.0.
      - "${PAGENTOS_BIND_IP:?the host's Tailscale IP; set in /opt/pagentos/.env}:8001:8001"
      # Loopback too, for the one-time identity bootstrap and host-side recovery/health.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  # ------------------------------------------------------------------ M18.4: blue/green
  # Two colours of the SAME workload behind the edge (docs/M18_4_SELF_EVOLUTION_SPEC.md §6).
  # Neither publishes a port; the edge is the one published socket. Both live under the
  # `bluegreen` profile, so `docker compose up` without it still runs the single `api`
  # exactly as before, and scripts/cloud/release-cloud-core-bluegreen.sh is the only thing
  # that starts them (first cutover: it stops `api`, starts the edge, brings blue up).
  api-blue:
    <<: *cloud-core
    image: pagentos/cloud-core:${PAGENTOS_IMAGE_BLUE:-local}
    container_name: pagentos-prod-api-blue
    profiles: ["bluegreen"]
    ports: []
    environment:
      <<: *cloud-core-env
      PAGENTOS_RELEASE: ${PAGENTOS_RELEASE_BLUE:-}
      PAGENTOS_LAST_KNOWN_GOOD: ${PAGENTOS_LAST_KNOWN_GOOD:-}

  api-green:
    <<: *cloud-core
    image: pagentos/cloud-core:${PAGENTOS_IMAGE_GREEN:-local}
    container_name: pagentos-prod-api-green
    profiles: ["bluegreen"]
    ports: []
    environment:
      <<: *cloud-core-env
      PAGENTOS_RELEASE: ${PAGENTOS_RELEASE_GREEN:-}
      PAGENTOS_LAST_KNOWN_GOOD: ${PAGENTOS_LAST_KNOWN_GOOD:-}

  edge:
    image: nginx:1.27-alpine
    container_name: pagentos-prod-edge
    profiles: ["bluegreen"]
    # The whole edge configuration lives on the persistent edge directory: nginx.conf (a
    # copy of infra/docker/edge/nginx.conf that the release script refreshes on every
    # release / rollback / reconcile), upstream.conf and active.txt (written by the same
    # script). nginx is started on that copy (-c), so a configuration change is a copy plus
    # `nginx -s reload` - never a recreation of the container. (A bind mount of the tree's
    # file kept the OLD inode after the release swapped the tree: the running edge could
    # not pick up a new nginx.conf at all - M18.4 gap 1.)
    command: ["nginx", "-c", "/etc/nginx/edge/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ${PAGENTOS_EDGE_DIR:-/mnt/pagentos-data/edge}:/etc/nginx/edge:ro
    ports:
      - "${PAGENTOS_BIND_IP:?the host's Tailscale IP; set in /opt/pagentos/.env}:8001:8001"
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  # ------------------------------------------------------------------ ADR-0197: aux
  # God's Eye View (MIT, pinned in infra/docker/godseye/Dockerfile): an owner-facing
  # third-party UI the owner asked to reach "whenever I want". Its own image, its own
  # socket on the SAME tailnet address and nowhere else (its dev server brokers whatever
  # provider keys it is given to anyone who can reach it - the tailnet is the boundary,
  # and the per-IP throttles are set as its SECURITY.md asks). No key is required; the
  # optional ones live in a separate root-only env file so they never enter the tree, the
  # image or this file. Under the `aux` profile: never part of the api's release
  # transaction (release-cloud-core-bluegreen.sh brings it up best-effort afterwards).
  godseye:
    build:
      context: ../../infra/docker/godseye
    image: pagentos/godseye:local
    container_name: pagentos-prod-godseye
    profiles: ["aux"]
    env_file:
      - path: ${GODSEYE_ENV_FILE:-/opt/pagentos/godseye.env}
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      GEV_RATELIMIT_OPENAI_PER_MIN: ${GODSEYE_RATELIMIT_OPENAI_PER_MIN:-20}
      GEV_RATELIMIT_GOOGLE_PER_MIN: ${GODSEYE_RATELIMIT_GOOGLE_PER_MIN:-60}
    ports:
      - "${PAGENTOS_BIND_IP:?the host's Tailscale IP; set in /opt/pagentos/.env}:4173:4173"
    mem_limit: 1536m
    restart: unless-stopped
