# Personal Agent OS - local development infrastructure (M0).
#
# Compose project name: pagentos
# All published ports bind 127.0.0.1 only (never exposed on the LAN).
#
# Host port map (chosen to avoid collisions on this machine; 5432 is taken by a
# locally installed PostgreSQL/SQL-Server-adjacent stack, 8000 by wslrelay):
#   PostgreSQL 16 + pgvector  127.0.0.1:15432 -> 5432
#   Redis 7                   127.0.0.1:16379 -> 6379
#   MinIO S3 API              127.0.0.1:19000 -> 9000
#   MinIO Console             127.0.0.1:19001 -> 9001
#   Temporal frontend (gRPC)  127.0.0.1:17233 -> 7233
#   Temporal Web UI           127.0.0.1:18233 -> 8080
#
# Credentials below are DEV-ONLY defaults for the local loopback compose stack.
# They are not secrets and must never be reused outside local development.

name: pagentos

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pagentos-postgres
    # Two settings the integration suite depends on, both dev-only:
    #
    # max_connections — several E2E tests spawn real worker/pipeline
    # subprocesses and some of them KILL the worker on purpose, because
    # surviving a hard kill is the property under test. Postgres 16's default
    # of 100 leaves too little headroom for that, and the suite then fails with
    # "too many clients already" in whichever test happens to ask for a
    # connection next — a failure that looks like a product defect and is not.
    #
    # tcp_keepalives_* — a killed client's socket is held open by Docker
    # Desktop's port forwarder, so the backend does not see the peer disappear
    # and lingers as `idle`. Server-side keepalives reap those in ~a minute
    # instead of at the OS default (hours).
    command:
      - postgres
      - "-c"
      - "max_connections=300"
      - "-c"
      - "tcp_keepalives_idle=30"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=3"
    environment:
      POSTGRES_USER: pagentos
      POSTGRES_PASSWORD: pagentos-dev # dev-only
      POSTGRES_DB: pagentos
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pagentos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagentos -d pagentos"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pagentos-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - pagentos-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pagentos-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin # dev-only
      MINIO_ROOT_PASSWORD: minioadmin # dev-only
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - pagentos-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: pagentos-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: pagentos
      POSTGRES_PWD: pagentos-dev # dev-only
      POSTGRES_SEEDS: postgres
      # auto-setup creates the "temporal" and "temporal_visibility" databases
      # on the shared postgres instance.
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:17233:7233"
    healthcheck:
      # Deterministic readiness for CI's `up --wait`: auto-setup finishes its
      # schema migration well before the frontend answers cluster health.
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: pagentos-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:18233
    ports:
      - "127.0.0.1:18233:8080"
    restart: unless-stopped

volumes:
  pagentos-postgres-data:
  pagentos-redis-data:
  pagentos-minio-data:
