# Personal Agent OS — the edge in front of the two Cloud Core colours (M18.4 spec §6).
#
# The ONE published socket. Which colour serves is a one-line upstream file the release
# script rewrites and reloads (`nginx -s reload` finishes in-flight requests on the old
# upstream and opens new ones on the new one). The device channel is a long-lived
# WebSocket, so the upgrade headers and the long read timeouts are not optional.
#
# No TLS here: the socket is bound to the tailnet address only (docker-compose.prod.yml),
# the same posture the api service had before the edge existed.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_max_body_size 32m;
    proxy_buffering off;

    # /etc/nginx/edge/upstream.conf is written by scripts/cloud/release-cloud-core-bluegreen.sh:
    #   upstream pagentos_api { server api-blue:8001; }
    include /etc/nginx/edge/upstream.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8001;

        # Which colour is active, as the script last wrote it (a file, so no nginx
        # variable has to be kept in step with the upstream).
        location = /edge/active {
            default_type text/plain;
            alias /etc/nginx/edge/active.txt;
        }

        location / {
            proxy_pass http://pagentos_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The device WebSocket idles between commands; a research fetch can take
            # minutes. Longer than anything the API waits for itself.
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
