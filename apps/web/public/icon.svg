<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Personal Agent OS Çekirdeği">
  <title>Personal Agent OS — Çekirdek</title>
  <defs>
    <radialGradient id="nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1d0" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffc86a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f0a53a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#06050a" />

  <!-- outer field -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#f0a53a" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 10" />

  <!-- independent orbital layers: three planes, three tilts -->
  <ellipse cx="256" cy="256" rx="206" ry="70" fill="none" stroke="#f0a53a" stroke-opacity="0.42" stroke-width="3" transform="rotate(-24 256 256)" />
  <ellipse cx="256" cy="256" rx="176" ry="102" fill="none" stroke="#ffb347" stroke-opacity="0.36" stroke-width="2.5" transform="rotate(37 256 256)" />
  <ellipse cx="256" cy="256" rx="142" ry="48" fill="none" stroke="#ffcf7a" stroke-opacity="0.3" stroke-width="2" transform="rotate(98 256 256)" />

  <!-- containment shell -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#c9a05a" stroke-opacity="0.28" stroke-width="1.6" />

  <!-- energy chamber -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#ffc86a" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="3 8" />

  <!-- processor fragments -->
  <rect x="352" y="180" width="18" height="11" fill="#f0a53a" fill-opacity="0.5" transform="rotate(28 361 185)" />
  <rect x="132" y="316" width="14" height="9" fill="#f0a53a" fill-opacity="0.45" transform="rotate(-42 139 320)" />
  <rect x="238" y="118" width="12" height="14" fill="#ffcf7a" fill-opacity="0.4" transform="rotate(16 244 125)" />

  <!-- the nucleus: warm white through gold -->
  <circle cx="256" cy="256" r="112" fill="url(#nucleus)" />
  <circle cx="256" cy="256" r="62" fill="#fff1d0" fill-opacity="0.72" stroke="#ffc86a" stroke-width="2.5" />
</svg>
