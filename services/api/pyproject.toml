[project]
name = "pagentos-api"
version = "0.1.0"
description = "Personal Agent OS - owner-facing API service (M0 foundation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "boto3>=1.34",
    "temporalio>=1.7",
    "structlog>=24.1",
    "cryptography>=43",
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "markdown>=3.6",
    "pgvector>=0.5.0",
    "httpx>=0.27",
    # M22 Artifact Factory (ADR-0085 decision 2): XLSX/PPTX renderers and PDF-text
    # validation are on the owner's create->render->validate path in production, not
    # just tests, so these move out of the dev group (docs/THIRD_PARTY_COMPONENTS.md).
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: requires the local docker compose stack (infra/docker/docker-compose.dev.yml)",
    "live: makes a real network call to a live third-party endpoint (never run by default CI)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
# The repo has a local "alembic/" migrations directory; the import target is
# the PyPI alembic package, so force third-party classification.
known-third-party = ["alembic"]
