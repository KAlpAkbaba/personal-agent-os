[project]
name = "pagentos-browser"
version = "0.1.0"
description = "Personal Agent OS - semantic browser automation adapter (M2 browser agent)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.49",
    "structlog>=24.1",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_agent"]

[tool.pytest.ini_options]
markers = [
    "browser: requires the real (Playwright-managed) Chromium binary",
    "live: opt-in, hits real network/search-engine/site endpoints with real Chrome",
]
# Default run is the fast unit suite; `-m browser` or `-m live` on the command
# line overrides this because pytest honors the last -m expression given.
addopts = "-m \"not browser and not live\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
