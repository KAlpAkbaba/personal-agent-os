<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup Opener</title>
</head>
<body>
  <h1>Popup Opener</h1>
  <button id="open" type="button">Open popup window</button>
  <script>
    document.getElementById("open").addEventListener("click", () => {
      window.open("popup-window.html", "pagentos-popup");
    });
  </script>
</body>
</html>
