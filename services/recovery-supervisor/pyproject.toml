[project]
name = "pagentos-recovery-supervisor"
version = "0.1.0"
description = "Personal Agent OS - Recovery Supervisor (M6). Stdlib-only runtime: must survive a broken main application release."
requires-python = ">=3.12,<3.13"
# HARD CONSTRAINT (RECOVERY_AND_SELF_HEALING.md §2): no runtime dependencies.
# The supervisor is the thing that rescues a broken release of everything else,
# so it may depend on nothing but the Python standard library. Test/lint tools
# are dev-only and never imported by the supervisor itself.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recovery_supervisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
